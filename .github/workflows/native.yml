name: Native builds

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android Debug (ARM64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' 'build-tools;36.0.0' \
            'ndk;27.1.12297006' 'cmake;3.22.1'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build Android example
        shell: bash
        run: |
          mkdir -p artifacts/ci
          set -o pipefail
          npm run build:android -- -PreactNativeArchitectures=arm64-v8a 2>&1 | tee artifacts/ci/android.log
      - name: Upload Android build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-android-logs
          path: artifacts/ci/*.log
          retention-days: 7
          if-no-files-found: warn

  ios:
    name: iOS Debug (simulator)
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify native tools
        run: |
          xcodebuild -version
          pod --version
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install locked CocoaPods dependencies
        shell: bash
        run: |
          mkdir -p artifacts/ci
          set -o pipefail
          npm run example:pods -- --deployment 2>&1 | tee artifacts/ci/pods.log
      - name: Build iOS simulator example
        shell: bash
        run: |
          set -o pipefail
          npm run build:ios 2>&1 | tee artifacts/ci/ios.log
      - name: Upload iOS build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-ios-logs
          path: artifacts/ci/*.log
          retention-days: 7
          if-no-files-found: warn
