name: Package checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Types, contracts, Codegen and packages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.17.1'
          cache: npm
      - name: Set up Java for native camera contract tests
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify C++ compiler
        run: c++ --version
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check types, contracts, Codegen and packed consumers
        shell: bash
        run: |
          mkdir -p artifacts/ci
          set -o pipefail
          npm run check 2>&1 | tee artifacts/ci/check.log
      - name: Upload package verification and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-verification
          retention-days: 7
          if-no-files-found: warn
          path: |
            artifacts/packages/*.tgz
            artifacts/ci/*.log

  bundles:
    name: Production JavaScript bundles
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.17.1'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Bundle example for iOS and Android
        shell: bash
        run: |
          mkdir -p artifacts/ci
          set -o pipefail
          npm run example:bundle 2>&1 | tee artifacts/ci/bundles.log
      - name: Upload bundles and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-bundles
          retention-days: 7
          if-no-files-found: warn
          path: |
            artifacts/bundles/
            artifacts/ci/*.log

# Full SDK builds and physical-device performance remain separate release gates.
# These jobs need no Google Maps credentials or repository secrets.
