name: Package contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.1
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run example:bundle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-verification
          path: |
            artifacts/packages/*.tgz
            artifacts/bundles/
# Native SDK builds and physical-device runs remain separate release gates.
